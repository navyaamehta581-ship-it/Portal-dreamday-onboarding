# Render Blueprint for the hosted Spotify Portal demo (fictional data only).
#
# Architecture: one Docker web service runs the whole prototype: the built Portal frontend, the shared-passphrase
# demo gate, the Portal session layer and the workflow API (bound to the container's loopback only). All state is
# SQLite on the persistent disk below, so the service runs as a single instance.
#
# Status: ready to apply. ./Dockerfile builds the Portal and runs services/workflow-api/src/production.ts, which reads
# exactly the variables below (a test keeps the two in sync) and serves /healthz. Nothing here deploys by itself: a
# Blueprint only takes effect when someone creates it in the Render dashboard (New > Blueprint), and autoDeploy is off.
# Setup steps: docs/deployment/render.md.
#
# Cost when applied: the Starter instance (about $7/month) plus the 1 GB disk (about $0.25/month). Persistent disks
# are not available on Render's free instances. Check current prices on render.com/pricing before applying.
#
# Secrets: none are stored in this file. Values marked `sync: false` are entered once in the Render dashboard when
# the Blueprint is created; `generateValue: true` lets Render create a random value.
services:
  - type: web
    name: spotify-portal-demo
    runtime: docker
    plan: starter
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deploy only when triggered from the dashboard, never on every push to main.
    autoDeploy: false
    healthCheckPath: /healthz
    # SQLite on an attached disk: exactly one instance (Render disks don't support scaling out).
    numInstances: 1
    disk:
      name: portal-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      # Where every SQLite database and generated demo credential is kept (the disk above).
      - key: PORTAL_DATA_DIR
        value: /var/data
      # Hosted inference for Chris's analysis and AiKA. Without a key the app falls back to clearly labelled
      # rule-based results and reports AiKA as unavailable.
      - key: PORTAL_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      # Hard daily cap on model requests across all visitors, to bound spend.
      - key: PORTAL_AI_DAILY_REQUEST_LIMIT
        value: "300"
      # Shared passphrase for the demo gate (entered in the dashboard), and the key that signs gate and persona
      # session cookies (generated by Render).
      - key: PORTAL_DEMO_PASSPHRASE
        sync: false
      - key: PORTAL_SESSION_SECRET
        generateValue: true
      # Demo rooms: each visitor works in an isolated sandbox that expires; the number of live rooms is capped.
      - key: PORTAL_DEMO_ROOM_LIMIT
        value: "50"
      - key: PORTAL_DEMO_ROOM_TTL_HOURS
        value: "24"
      # Repository evidence: the fictional Aperture Commerce payments-api uses labelled sample data. Add
      # ACTIVATION_GITHUB_REPOSITORY_TOKEN (read-only) in the dashboard only if a real repository is configured.
      - key: ACTIVATION_EVIDENCE_MAX_AGE_HOURS
        value: "24"
