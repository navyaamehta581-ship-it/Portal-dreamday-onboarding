# Render Blueprint for the hosted Spotify Portal demo (fictional data only), on Render's FREE plan.
#
# Architecture: one Docker web service runs the whole prototype: the built Portal frontend, the shared-passphrase
# demo gate, the Portal session layer and the workflow API (bound to the container's loopback only).
#
# Free plan, temporary data: there is no persistent disk. SQLite lives in /tmp inside the container
# (PORTAL_STORAGE=ephemeral), so every demo room and all demo work is lost when the service restarts, redeploys or
# sleeps (Render spins free services down after about 15 minutes without traffic; waking takes about a minute).
# Visitors are told this on the gate page and in the Portal's demo-room bar.
#
# AI: Gemini's free tier (no billing). Requests are paced (PORTAL_AI_REQUESTS_PER_MINUTE) and capped per day
# (PORTAL_AI_DAILY_REQUEST_LIMIT) below the free quota; when Google answers 429 the server waits as asked and the
# analysis falls back to labelled rule-based results. On the free tier Google may use submitted text to improve its
# products, so the demo is for fictional data only. Check your project's quotas in Google AI Studio and adjust.
#
# Status: ready to apply. ./Dockerfile runs services/workflow-api/src/production.ts, which reads exactly the
# variables below (a test keeps the two in sync) and serves /healthz. Nothing here deploys by itself: a Blueprint
# only takes effect when someone creates it in the Render dashboard (New > Blueprint), and autoDeploy is off.
# Setup steps: docs/deployment/render.md.
#
# Cost: $0. No paid instance, no disk, no paid AI. Free instance hours are limited per workspace each month; check
# render.com/docs/free.
#
# Secrets: none are stored in this file. Values marked `sync: false` are entered once in the Render dashboard when
# the Blueprint is created; `generateValue: true` lets Render create a random value.
services:
  - type: web
    name: spotify-portal-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    # Deploy only when triggered from the dashboard, never on every push to main.
    autoDeploy: false
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      # Temporary storage inside the container: no persistent disk on the free plan.
      - key: PORTAL_STORAGE
        value: ephemeral
      - key: PORTAL_DATA_DIR
        value: /tmp/spotify-portal-demo
      # Hosted inference for Chris's analysis and AiKA on Gemini's free tier. Without a key the app falls back to
      # clearly labelled rule-based results and reports AiKA as unavailable.
      - key: PORTAL_LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-2.5-flash
      - key: GEMINI_API_KEY
        sync: false
      # Stay inside the free quota: requests wait for a slot above this per-minute rate, and stop for the UTC day
      # at the daily cap (the count starts again after a restart; Google's own quota still applies).
      - key: PORTAL_AI_REQUESTS_PER_MINUTE
        value: "8"
      - key: PORTAL_AI_DAILY_REQUEST_LIMIT
        value: "200"
      # Shared passphrase for the demo gate (entered in the dashboard), and the key that signs gate and persona
      # session cookies (generated by Render).
      - key: PORTAL_DEMO_PASSPHRASE
        sync: false
      - key: PORTAL_SESSION_SECRET
        generateValue: true
      # Demo rooms: each visitor works in an isolated sandbox that expires (or ends earlier when the free service
      # restarts or sleeps); the number of live rooms is capped.
      - key: PORTAL_DEMO_ROOM_LIMIT
        value: "50"
      - key: PORTAL_DEMO_ROOM_TTL_HOURS
        value: "24"
      # Repository evidence: the fictional Aperture Commerce payments-api uses labelled sample data.
      - key: ACTIVATION_EVIDENCE_MAX_AGE_HOURS
        value: "24"
