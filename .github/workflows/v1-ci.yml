name: V1 validation

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  v1:
    name: V1 tests and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: prototypes/v1
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: prototypes/v1/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Run V1 unit tests
        run: npm test
      - name: Check read-only GitHub inspector
        run: npm run test:inspector
      - name: Check types and build V1
        run: npm run build
