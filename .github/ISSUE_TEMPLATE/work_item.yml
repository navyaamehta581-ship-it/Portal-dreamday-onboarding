name: Blueprint atom
description: Claim a focused managed Portal atom with dependencies and evidence.
title: "[ATOM-ID] "
body:
  - type: input
    id: atoms
    attributes:
      label: Atom IDs and dependencies
      description: Use the register IDs; link prerequisite issues and their proof.
    validations:
      required: true
  - type: input
    id: ownership
    attributes:
      label: Owner and reviewer
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Contract and scope
      description: Expand the blueprint ticket schema including files, inputs, operation, outputs, failure/recovery and applicability. State real versus simulated behavior.
    validations:
      required: true
  - type: textarea
    id: capabilities
    attributes:
      label: Managed Portal assumptions and evidence
      description: Cite runtime/capability decisions or mark UNKNOWN. Generic Backstage examples do not establish tenant compatibility.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: PASS criterion, positive and negative tests
      description: Retain the atom criterion and identify the evidence layer and exact validation commands.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Proof and review decision
      description: Add sanitized run/commit references, provider or tenant observations where required, PR and reviewer decision before DONE. Update docs/backlog/atoms.json.
